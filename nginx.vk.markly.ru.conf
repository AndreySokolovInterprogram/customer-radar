# Конфигурация Nginx для сервиса «Проект Маркли» (vk.markly.ru)
# Расположение на сервере: /etc/nginx/sites-available/vk.markly.ru.conf

# Редирект HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vk.markly.ru;

    # Поддержка проверки Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vk.markly.ru;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vk.markly.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vk.markly.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Корневая папка со статическими файлами
    root /opt/customer-radar/public;
    index index.html;

    # Заголовки безопасности
    # Внимание: для работы внутри VK Mini Apps фреймы разрешены с vk.com и субдоменов
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://vk.com https://*.vk.com https://m.vk.com https://*.vk-apps.com;" always;

    # Защита: блокировка скрытых файлов и служебных папок (кроме .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Защита: блокировка обращений к базам данных, скриптам, бэкапам и окружению
    location ~* (?:\.(?:env|git|sqlite|sqlite3|db|py|pyc|sh|yml|yaml|ini|log|bak|sql)|api\.env|cache\.db|wp-admin|wp-login|phpunit) {
        deny all;
        return 404;
    }

    # Статические файлы (HTML, CSS, JS, изображения)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Правовые документы с прямой отдачей
    location = /privacy.html {
        try_files /privacy.html =404;
        expires 1h;
    }

    location = /terms.html {
        try_files /terms.html =404;
        expires 1h;
    }

    # Проксирование API на FastAPI (Uvicorn на 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Проброс заголовка параметров запуска VK Mini Apps
        proxy_set_header X-VK-Launch-Params $http_x_vk_launch_params;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;

        # Буферизация ответов
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
