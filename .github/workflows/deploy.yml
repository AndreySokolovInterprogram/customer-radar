name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML is well-formed
        run: python3 -c "import html.parser, sys; p = html.parser.HTMLParser(); p.feed(open('index.html', encoding='utf-8').read())"

      - name: Validate API syntax
        run: python3 -c "import ast; [ast.parse(open(f).read()) for f in ['api/main.py', 'api/refresh_cache.py']]"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync static files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            index.html \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/customer-radar/public/"

      - name: Sync API code
        run: |
          rsync -az \
            --exclude 'cache.db' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            api/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/customer-radar/api/"

      - name: Restart API services
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo -n systemctl restart customer-radar-api.service && sudo -n systemctl restart customer-radar-refresh.service"

      - name: Write VK secure key (if configured)
        env:
          VK_SECURE_KEY: ${{ secrets.VK_SECURE_KEY }}
        run: |
          if [ -z "$VK_SECURE_KEY" ]; then
            echo "VK_SECURE_KEY not set, skipping"
            exit 0
          fi
          printf 'VK_SECURE_KEY=%s\n' "$VK_SECURE_KEY" > vk_secure_key.env
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            vk_secure_key.env \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/customer-radar/.env"
          rm -f vk_secure_key.env

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
