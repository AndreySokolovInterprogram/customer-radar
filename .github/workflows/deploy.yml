name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML files are well-formed
        run: |
          python3 -c "
          import html.parser, sys
          for filename in ['index.html', 'privacy.html', 'terms.html']:
              parser = html.parser.HTMLParser()
              parser.feed(open(filename, encoding='utf-8').read())
          print('All HTML files validated successfully.')
          "

      - name: Validate API syntax
        run: python3 -c "import ast; [ast.parse(open(f).read()) for f in ['api/main.py', 'api/refresh_cache.py']]; print('Python syntax validated successfully.')"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync static files
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            index.html privacy.html terms.html \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/customer-radar/public/"

      - name: Sync API code and data
        run: |
          rsync -az \
            --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            api/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/customer-radar/api/"

      - name: Update Nginx configuration (if permitted)
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo -n -l 2>&1 || true; ls -la /etc/nginx/sites-enabled/ 2>&1 || true"


      - name: Write VK secret key (if configured)
        env:
          VK_SECRET_KEY: ${{ secrets.VK_SECRET_KEY }}
        run: |
          if [ -z "$VK_SECRET_KEY" ]; then
            echo "VK_SECRET_KEY not set, skipping"
            exit 0
          fi
          printf 'VK_SECRET_KEY=%s\n' "$VK_SECRET_KEY" > vk_secret_key.env
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            vk_secret_key.env \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/customer-radar/.env"
          rm -f vk_secret_key.env

      - name: Restart API web service (uvicorn only)
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo -n systemctl restart customer-radar-api.service"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
